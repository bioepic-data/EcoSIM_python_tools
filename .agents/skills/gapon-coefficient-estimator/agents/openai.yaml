display_name: Gapon Coefficient Estimator
short_description: Derive Gapon coefficients or initialize them from depth-explicit ecosystem templates.
default_prompt: Derive Ca-normalized Gapon coefficients from paired exchange and solution chemistry when possible. Otherwise, select the closest ecosystem template, remap all six EcoSIM Gapon values to the target soil depths, preserve provenance, and state that the template-based starting values are subject to tuning.
